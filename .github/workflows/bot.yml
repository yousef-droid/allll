name: FunPay Stealth Automation

on:
  schedule:
    # يحاول تشغيل السكريبت تلقائياً كل ساعة لضمان الاستمرارية
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: funpay-stealth-group
  # يمنع إيقاف السكريبت الحالي إذا كان لا يزال يعمل
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm install axios

      - name: Start Stealth Bot
        env:
          FUNPAY_COOKIES: ${{ secrets.FUNPAY_COOKIES }}
        run: node bot.js
